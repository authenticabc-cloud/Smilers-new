[pytest]
asyncio_mode = auto
; iter-198: motor's client binds to the FIRST event loop that performs IO.
; With the default function-scoped loops, the second async test touching
; MongoDB gets "Future attached to a different loop". One shared
; session-scoped loop fixes this for every async test.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
